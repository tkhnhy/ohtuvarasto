{% extends "base.html" %}

{% block title %}Luo varasto{% endblock %}

{% block content %}
<div class="container">
    <h1>Luo uusi varasto</h1>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="post">
        <div class="form-group">
            <label for="name">Nimi:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="tilavuus">Tilavuus (kapasiteetti):</label>
            <input type="number" id="tilavuus" name="tilavuus" step="0.1" min="0" value="100" required>
        </div>
        
        <div class="form-group">
            <label for="alku_saldo">Alkusaldo:</label>
            <input type="number" id="alku_saldo" name="alku_saldo" step="0.1" min="0" value="0">
        </div>
        
        <button type="submit" class="btn btn-success">Luo varasto</button>
        <a href="{{ url_for('index') }}" class="btn">Peruuta</a>
    </form>
</div>
{% endblock %}
