{% extends "base.html" %}

{% block title %}Muokkaa: {{ warehouse.name }}{% endblock %}

{% block content %}
<div class="container">
    <h1>Muokkaa varastoa</h1>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="post">
        <div class="form-group">
            <label for="name">Nimi:</label>
            <input type="text" id="name" name="name" value="{{ warehouse.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="tilavuus">Tilavuus (kapasiteetti):</label>
            <input type="number" id="tilavuus" name="tilavuus" step="0.1" min="0" value="{{ warehouse.varasto.tilavuus }}" required>
        </div>
        
        <p><em>Nykyinen saldo: {{ "%.1f"|format(warehouse.varasto.saldo) }} (säilyy muokkauksessa)</em></p>
        
        <button type="submit" class="btn btn-success">Tallenna</button>
        <a href="{{ url_for('view_warehouse', warehouse_id=warehouse.id) }}" class="btn">Peruuta</a>
    </form>
</div>
{% endblock %}
